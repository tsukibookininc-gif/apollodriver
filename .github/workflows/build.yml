name: Build and offline verification
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Identify cloud host
        run: |
          uname -a
          c++ --version
          python3 --version
      - name: Build and test protocol and CLI
        run: make -j2 test
      - name: Exercise macOS inventory without Apollo hardware
        if: runner.os == 'macOS'
        run: |
          ./build/apollo-inspect --descriptors > build/cloud-inventory.json
          python3 -c 'import json; d=json.load(open("build/cloud-inventory.json")); assert d["devices"] == []; assert not d["hardware_audio_verified"]; print("No Apollo attached: enumeration path only, no audio verified")'
      - name: Address and undefined-behavior sanitizers
        run: |
          c++ -std=c++17 -Iinclude -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer src/protocol.cpp tests/protocol_test.cpp -o build/protocol-sanitized
          ./build/protocol-sanitized
      - name: Ad-hoc sign the macOS research tool
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - build/apollo-inspect
          codesign --verify --verbose build/apollo-inspect
          shasum -a 256 build/apollo-inspect > build/SHA256SUMS
      - name: Save macOS research binary (not notarized, no installer)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: apollo-inspect-${{ matrix.os }}-${{ runner.arch }}
          path: |
            build/apollo-inspect
            build/SHA256SUMS
          retention-days: 14
